- name: Update system to version 1.7.0
  hosts: linux_servers
  become: yes
  tasks:
    - name: Check current version of the system
      shell: rpm -q <package_name>
      register: current_version
      ignore_errors: yes

    - name: Parse current version
      set_fact:
        current_version_number: "{{ current_version.stdout.split('=')[1].split('.')[0] }}"
      when: current_version.stdout != ""

    - name: Determine if update is needed
      set_fact:
        update_needed: "{{ current_version_number | int < 170 }}"
      when: current_version.stdout != ""

    - name: Download update package for version 1.7.0
      get_url:
        url: "https://official-source-or-repository/<package_name>-1.7.0.rpm"
        dest: "/tmp/<package_name>-1.7.0.rpm"
      when: update_needed

    - name: Install update package
      rpm:
        name: "/tmp/<package_name>-1.7.0.rpm"
        state: present
      when: update_needed